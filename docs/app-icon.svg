<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1745C9"/>
      <stop offset="0.55" stop-color="#0B2A94"/>
      <stop offset="1" stop-color="#061A66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#FF85C0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF85C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9BCB"/>
      <stop offset="1" stop-color="#FF6FB3"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFB8DA"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#FFA8D3"/>
      <stop offset="0.6" stop-color="#FF6FB3"/>
      <stop offset="1" stop-color="#F04A9C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#030E3D" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#B0145F" flood-opacity="0.45"/>
    </filter>
    <filter id="flapshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-6" dy="-6" stdDeviation="9" flood-color="#061A66" flood-opacity="0.35"/>
    </filter>
    <clipPath id="page">
      <path d="M322 270 H702 A90 90 0 0 1 792 360 V680 L672 800 H322 A90 90 0 0 1 232 710 V360 A90 90 0 0 1 322 270 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M322 270 H702 A90 90 0 0 1 792 360 V680 L672 800 H322 A90 90 0 0 1 232 710 V360 A90 90 0 0 1 322 270 Z" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#page)">
    <rect x="232" y="270" width="560" height="150" fill="url(#head)"/>
    <!-- header shine -->
    <rect x="232" y="270" width="560" height="62" fill="#FFFFFF" opacity="0.16"/>
  </g>

  <!-- date grid -->
  <g fill="#0B2A94">
    <rect x="300" y="468" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="420" y="468" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="540" y="468" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="660" y="468" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="300" y="578" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="420" y="578" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="660" y="578" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="300" y="688" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="420" y="688" width="64" height="64" rx="22" opacity="0.14"/>
    <rect x="540" y="688" width="64" height="64" rx="22" opacity="0.14"/>
  </g>
  <!-- two events as solid deep-blue tiles -->
  <rect x="300" y="578" width="64" height="64" rx="22" fill="#0B2A94"/>
  <rect x="420" y="688" width="64" height="64" rx="22" fill="#0B2A94"/>

  <!-- the bubble: today -->
  <g filter="url(#soft)">
    <circle cx="572" cy="610" r="66" fill="url(#bubble)"/>
  </g>
  <ellipse cx="548" cy="582" rx="26" ry="15" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 548 582)"/>
  <circle cx="601" cy="642" r="7" fill="#FFFFFF" opacity="0.6"/>

  <!-- curled corner -->
  <g filter="url(#flapshadow)">
    <path d="M672 800 L792 680 L792 770 A30 30 0 0 1 762 800 Z" fill="url(#flap)" transform="translate(0 0)"/>
  </g>
  <path d="M672 800 L792 680" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3" fill="none"/>

  <!-- binder tabs -->
  <g>
    <rect x="352" y="196" width="56" height="130" rx="28" fill="#FFFFFF"/>
    <rect x="616" y="196" width="56" height="130" rx="28" fill="#FFFFFF"/>
    <rect x="366" y="216" width="28" height="70" rx="14" fill="#0B2A94"/>
    <rect x="630" y="216" width="28" height="70" rx="14" fill="#0B2A94"/>
  </g>

  <!-- sparkle -->
  <path d="M846 214 C851 250 858 257 894 262 C858 267 851 274 846 310 C841 274 834 267 798 262 C834 257 841 250 846 214 Z" fill="#FFFFFF"/>
  <circle cx="176" cy="842" r="13" fill="#FF85C0"/>
  <circle cx="216" cy="890" r="7" fill="#FFFFFF" opacity="0.8"/>
</svg>
