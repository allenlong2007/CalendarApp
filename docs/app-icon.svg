<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0B2370"/>
      <stop offset="1" stop-color="#050F40"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2358E6"/>
      <stop offset="1" stop-color="#0B2A94"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FC"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9CCB"/>
      <stop offset="1" stop-color="#FF6FB3"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E6BF0"/>
      <stop offset="1" stop-color="#1F46C8"/>
    </linearGradient>
    <radialGradient id="today" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFA6D2"/>
      <stop offset="1" stop-color="#FF5FA8"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020A33" flood-opacity="0.3"/>
    </filter>
    <filter id="shsm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#C21A6B" flood-opacity="0.4"/>
    </filter>
    <filter id="ring" x="-60%" y="-30%" width="220%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020A33" flood-opacity="0.4"/>
    </filter>
    <clipPath id="frontclip"><rect x="166" y="236" width="692" height="604" rx="100"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- stacked sheets -->
  <g filter="url(#sh)"><rect x="262" y="262" width="500" height="684" rx="90" fill="url(#back)"/></g>
  <g filter="url(#sh)"><rect x="214" y="250" width="596" height="654" rx="96" fill="url(#mid)"/></g>
  <g filter="url(#sh)"><rect x="166" y="236" width="692" height="604" rx="100" fill="url(#front)"/></g>

  <!-- header -->
  <g clip-path="url(#frontclip)">
    <rect x="166" y="236" width="692" height="168" fill="url(#head)"/>
    <rect x="166" y="236" width="692" height="70" fill="#FFFFFF" opacity="0.07"/>
  </g>
  <rect x="236" y="320" width="150" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="236" y="358" width="90" height="16" rx="8" fill="#FFFFFF" opacity="0.5"/>

  <!-- binder rings -->
  <g filter="url(#ring)">
    <rect x="318" y="190" width="56" height="124" rx="28" fill="#FFFFFF"/>
    <rect x="650" y="190" width="56" height="124" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="332" y="210" width="28" height="66" rx="14" fill="#0B2A94"/>
  <rect x="664" y="210" width="28" height="66" rx="14" fill="#0B2A94"/>

  <!-- date grid -->
  <g fill="#0B2A94">
    <circle cx="320" cy="490" r="24" opacity="0.13"/>
    <circle cx="448" cy="490" r="24" opacity="0.13"/>
    <circle cx="576" cy="490" r="24" opacity="0.13"/>
    <circle cx="704" cy="490" r="24"/>
    <circle cx="320" cy="610" r="24"/>
    <circle cx="448" cy="610" r="24" opacity="0.13"/>
    <circle cx="704" cy="610" r="24" opacity="0.13"/>
    <circle cx="320" cy="730" r="24" opacity="0.13"/>
    <circle cx="448" cy="730" r="24" opacity="0.13"/>
    <circle cx="576" cy="730" r="24"/>
    <circle cx="704" cy="730" r="24" opacity="0.13"/>
  </g>
  <g filter="url(#shsm)"><circle cx="576" cy="610" r="56" fill="url(#today)"/></g>
</svg>
